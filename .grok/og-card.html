<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>AutoMarket</title>
  <style>
    @font-face {
      font-family: "Cinzel";
      src: url("./fonts/Cinzel-600.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: "Outfit";
      src: url("./fonts/Outfit-500.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0c0d10;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse 80% 48% at 50% 12%, rgba(232, 165, 75, 0.2) 0%, rgba(232, 165, 75, 0) 58%),
        radial-gradient(ellipse 58% 34% at 50% 100%, rgba(232, 165, 75, 0.16) 0%, rgba(12, 13, 16, 0) 70%),
        linear-gradient(180deg, #14151b 0%, #0c0d10 46%, #090a0d 100%);
      color: #f4f1ea;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 46%, rgba(12, 13, 16, 0.68) 100%);
      pointer-events: none;
      z-index: 8;
    }
    .rib {
      position: absolute;
      top: 0;
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, rgba(154, 149, 140, 0.28) 0%, rgba(154, 149, 140, 0.06) 50%, transparent 100%);
      z-index: 1;
    }
    .spot {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #f4e2c4 0%, #e8a54b 40%, rgba(232, 165, 75, 0.12) 68%, transparent 100%);
      z-index: 1;
    }
    .beam {
      position: absolute;
      left: 50%;
      top: 0;
      width: 420px;
      height: 280px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(232, 165, 75, 0.16) 0%, rgba(232, 165, 75, 0.04) 46%, transparent 100%);
      clip-path: polygon(38% 0, 62% 0, 92% 100%, 8% 100%);
      z-index: 1;
      pointer-events: none;
    }
    .floor {
      position: absolute;
      left: -12%;
      right: -12%;
      bottom: -70px;
      height: 380px;
      transform: perspective(900px) rotateX(68deg);
      transform-origin: center bottom;
      background:
        linear-gradient(to top, rgba(12, 13, 16, 0.96) 0%, rgba(12, 13, 16, 0.2) 42%, transparent 70%),
        radial-gradient(ellipse at 50% 30%, rgba(232, 165, 75, 0.18) 0%, transparent 55%),
        repeating-linear-gradient(90deg, transparent 0 160px, rgba(154, 149, 140, 0.08) 160px 161px),
        linear-gradient(180deg, rgba(154, 149, 140, 0.08), rgba(12, 13, 16, 0.5));
      z-index: 2;
    }
    .horizon {
      position: absolute;
      left: 8%;
      right: 8%;
      bottom: 168px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(154, 149, 140, 0.28) 20%, rgba(232, 165, 75, 0.35) 50%, rgba(154, 149, 140, 0.28) 80%, transparent);
      z-index: 3;
    }
    .floor-shine {
      position: absolute;
      left: 50%;
      bottom: 28px;
      width: 560px;
      height: 56px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse at center, rgba(232, 165, 75, 0.3) 0%, rgba(232, 165, 75, 0.08) 46%, transparent 74%);
      filter: blur(10px);
      z-index: 3;
    }
    .lockup {
      position: absolute;
      left: 50%;
      top: 236px;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 6;
      width: 780px;
    }
    .lockup h1 {
      font-family: "Cinzel", "Liberation Serif", serif;
      font-weight: 600;
      font-size: 84px;
      letter-spacing: 0.09em;
      color: #f4f1ea;
      line-height: 1;
      text-shadow: 0 0 42px rgba(232, 165, 75, 0.3), 0 2px 0 rgba(12, 13, 16, 0.7);
    }
    .rule {
      width: 152px;
      height: 2px;
      margin: 16px auto 14px;
      background: linear-gradient(90deg, transparent, #e8a54b 16%, #f4f1ea 50%, #e8a54b 84%, transparent);
    }
    .tag {
      font-family: "Outfit", "Liberation Sans", sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #9a958c;
    }
    .car {
      position: absolute;
      left: 50%;
      bottom: 58px;
      transform: translateX(-50%);
      width: 620px;
      z-index: 5;
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.6));
    }
    .car-reflect {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%) scaleY(-0.38);
      width: 620px;
      opacity: 0.22;
      filter: blur(4px);
      z-index: 4;
      mask-image: linear-gradient(to top, rgba(0,0,0,0.65), transparent 68%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.65), transparent 68%);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="rib" style="left: 96px;"></div>
    <div class="rib" style="left: 188px; opacity: 0.55;"></div>
    <div class="rib" style="right: 188px; opacity: 0.55;"></div>
    <div class="rib" style="right: 96px;"></div>
    <div class="beam"></div>
    <div class="spot" style="left: 17%; top: 22px; width: 16px; height: 16px;"></div>
    <div class="spot" style="left: 31%; top: 14px; width: 11px; height: 11px; opacity: 0.65;"></div>
    <div class="spot" style="left: 50%; top: 10px; width: 10px; height: 10px; transform: translateX(-50%); opacity: 0.5;"></div>
    <div class="spot" style="right: 31%; top: 14px; width: 11px; height: 11px; opacity: 0.65;"></div>
    <div class="spot" style="right: 17%; top: 22px; width: 16px; height: 16px;"></div>

    <div class="floor"></div>
    <div class="horizon"></div>
    <div class="floor-shine"></div>

    <div class="lockup">
      <h1>AutoMarket</h1>
      <div class="rule"></div>
      <div class="tag">Compra · Venta · Permuta</div>
    </div>

    <svg class="car-reflect" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <use href="#sedan"></use>
    </svg>

    <svg class="car" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sedan">
      <defs>
        <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2c2e35"/>
          <stop offset="48%" stop-color="#15171c"/>
          <stop offset="100%" stop-color="#0c0d10"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="0.8" y2="1">
          <stop offset="0%" stop-color="#4a4e58"/>
          <stop offset="100%" stop-color="#14161c"/>
        </linearGradient>
        <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#e8a54b" stop-opacity="0"/>
          <stop offset="22%" stop-color="#e8a54b"/>
          <stop offset="78%" stop-color="#f4f1ea" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#e8a54b" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="rim" cx="36%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ece7dc"/>
          <stop offset="42%" stop-color="#9a958c"/>
          <stop offset="100%" stop-color="#3f3c38"/>
        </radialGradient>
      </defs>
      <g id="sedan">
        <ellipse cx="450" cy="236" rx="290" ry="12" fill="#e8a54b" opacity="0.16"/>
        <path fill="url(#body)" stroke="#2f3238" stroke-width="1.5"
          d="M122 188
             C112 186 108 170 122 156
             L174 108
             C218 64 278 50 348 48
             C438 44 558 48 646 74
             C700 92 744 124 786 152
             C816 170 842 178 852 192
             C858 202 850 214 832 216
             L708 222
             C702 188 658 172 616 172
             C574 172 536 190 530 222
             L322 222
             C316 190 272 172 230 172
             C188 172 152 190 146 222
             L132 220
             C114 216 112 198 122 188 Z"/>
        <path fill="none" stroke="url(#copper)" stroke-width="2.6" stroke-linecap="round"
          d="M168 148 C258 96 404 80 558 94 C646 104 724 130 804 168"/>
        <path fill="url(#glass)"
          d="M220 148 C256 96 318 72 398 68 C504 64 588 80 646 108
             L624 148 C558 128 474 120 398 122 C328 124 264 136 220 148 Z"/>
        <path fill="none" stroke="#e8a54b" stroke-opacity="0.28" stroke-width="1.25"
          d="M232 144 C276 104 344 86 414 84"/>
        <path d="M398 70 L388 148" stroke="#0c0d10" stroke-width="4"/>
        <path d="M528 80 L522 148" stroke="#0c0d10" stroke-width="3.5"/>
        <path d="M156 154 H818" stroke="#9a958c" stroke-opacity="0.28" stroke-width="1.25"/>
        <ellipse cx="832" cy="178" rx="16" ry="8" fill="#f4f1ea"/>
        <ellipse cx="832" cy="178" rx="16" ry="8" fill="#e8a54b" opacity="0.5"/>
        <ellipse cx="832" cy="178" rx="26" ry="13" fill="#e8a54b" opacity="0.16"/>
        <rect x="132" y="162" width="16" height="9" rx="3" fill="#c4842e"/>
        <g transform="translate(230 208)">
          <circle r="36" fill="#0c0d10"/>
          <circle r="30" fill="url(#rim)"/>
          <circle r="13" fill="#0c0d10"/>
          <circle r="5" fill="#e8a54b"/>
        </g>
        <g transform="translate(616 208)">
          <circle r="36" fill="#0c0d10"/>
          <circle r="30" fill="url(#rim)"/>
          <circle r="13" fill="#0c0d10"/>
          <circle r="5" fill="#e8a54b"/>
        </g>
      </g>
    </svg>
    <div class="vignette"></div>
  </div>
</body>
</html>
